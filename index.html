<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Entrenador Anti-Phishing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="quiz-screen">
            <h1>🛡️ Entrenador Anti-Phishing</h1>
            <p>Evalúa cada situación y decide si es phishing o legítimo</p>

            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="question-counter" id="counter">Pregunta 1 de 10</div>

            <div class="exercise-card" id="exercise">
                <!-- Contenido del ejercicio se carga aquí -->
            </div>

            <div class="buttons">
                <button class="btn btn-phishing" id="btn-phishing">
                    ⚠️ ES PHISHING
                </button>
                <button class="btn btn-legitimate" id="btn-legitimate">
                    ✅ ES LEGÍTIMO
                </button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="result-screen">
                <div id="celebration"></div>
                <h2 id="result-title"></h2>
                <div class="score" id="score"></div>
                <div id="feedback"></div>
                <button class="restart-btn" id="restart-btn">🔄 Intentar de Nuevo</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
